# 열린 share:/unshare: Issue를 오래된 것부터 모두 처리한다(검사 → 바로 게시, 또는 이유를 댓글로).
# Issue가 열릴 때, 30분마다(놓친 것·실패한 것 다시), 수동으로 돈다. 게시가 있으면 site 워크플로를 깨운다.
# Issue 제목과 본문은 run에 끼워 넣지 않고 gh로 받아 스크립트 안에서만 읽는다.
name: intake
on:
  issues:
    types: [opened]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
jobs:
  intake:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'share:') || startsWith(github.event.issue.title, 'unshare:')
    runs-on: ubuntu-latest
    concurrency:
      group: intake
      cancel-in-progress: false
    steps:
      # Issue 이벤트의 기본 커밋은 Issue가 열린 순간의 것이다. 앞선 접수가 push한 것을 보려고 최신 main을 받는다
      - uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: node scripts/intake.ts
        env:
          GH_TOKEN: ${{ github.token }}
